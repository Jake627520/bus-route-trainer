name: CI

# 與本機同一套容器環境（含 Postgres）跑 lint/test/build，
# 修好舊 setup-node CI 缺 DB 導致整合測試失敗的問題。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Test, Build (in container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 容器以非 root 的 node (uid 1000) 執行；把 checkout 交給它，
      # 否則寫 .next/、prisma 產物到 bind-mount 會 EACCES。
      - name: Make workspace writable by container user
        run: sudo chown -R 1000:1000 .

      - name: Build image
        run: docker compose build

      - name: Start Postgres (wait healthy)
        run: docker compose up -d --wait db

      - name: Install deps (in container)
        run: docker compose run --rm app npm ci

      - name: Prisma generate + migrate
        run: |
          docker compose run --rm app npx prisma generate
          docker compose run --rm app npx prisma migrate deploy

      - name: Lint (in container)
        run: docker compose run --rm app npm run lint

      - name: Test (in container)
        run: docker compose run --rm app npm test

      - name: Build (in container)
        run: docker compose run --rm app npm run build
