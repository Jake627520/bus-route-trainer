name: GTFS Weekly Update

on:
  schedule:
    - cron: '0 20 * * 6' # Sunday 06:00 Brisbane
  workflow_dispatch: {}

permissions: {}
concurrency:
  group: gtfs-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.ver.outputs.changed }}
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - name: Check required secret
        env:
          GTFS_DATABASE_URL: ${{ secrets.GTFS_DATABASE_URL }}
        run: |
          if [ -z "$GTFS_DATABASE_URL" ]; then
            echo "::error::GTFS_DATABASE_URL secret is not set. Add the direct database URL in repository Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Require default branch
        env:
          RUN_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$RUN_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo '::error::Run GTFS updates from the default branch only.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec --no -- prisma generate
      - name: Download and safely extract SEQ GTFS feed
        run: python3 scripts/download-gtfs.py
      - name: Determine feed content version
        id: ver
        run: |
          NEW=$(sha256sum seq_gtfs.zip | cut -d ' ' -f 1)
          OLD=$(cat .github/gtfs-feed-version 2>/dev/null || true)
          echo "hash=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$OLD" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          echo "Feed SHA-256: $NEW"
      - name: Import to Neon (bus + ferry + train subset)
        if: steps.ver.outputs.changed == 'true'
        env:
          GTFS_DATABASE_URL: ${{ secrets.GTFS_DATABASE_URL }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          export DATABASE_URL="$GTFS_DATABASE_URL"
          export DIRECT_URL="$GTFS_DATABASE_URL"
          npm exec --no -- tsx scripts/import-gtfs.ts ./seq_gtfs --clear --weekly --tx-timeout-ms=1800000
      - name: No update needed
        if: steps.ver.outputs.changed == 'false'
        run: echo 'Feed content unchanged; skipping import.'

  record-version:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Commit new feed content marker
        env:
          NEW_HASH: ${{ needs.update.outputs.hash }}
        run: |
          if ! [[ "$NEW_HASH" =~ ^[a-f0-9]{64}$ ]]; then
            echo '::error::Invalid feed hash'
            exit 1
          fi
          echo "$NEW_HASH" > .github/gtfs-feed-version
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/gtfs-feed-version
          git commit -m "chore(gtfs): update feed content hash" || { echo '::error::Failed to commit feed marker'; exit 1; }
          git push
