<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#242b4c">
<title>Offline · Route Memory Trainer</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #242b4c; --muted: #4e5a80; --btn: #242b4c; --btn-fg: #fff; --accent: #ef60a3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1326; --fg: #e6e9f2; --muted: #aab2c6; --btn: #e6e9f2; --btn-fg: #0e1326; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px; background: var(--bg); color: var(--fg);
         font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; line-height: 1.5; }
  main { max-width: 22rem; text-align: center; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin-bottom: 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--muted); }
  button { min-height: 44px; min-width: 44px; padding: 0 24px; border: 0; border-radius: 12px; cursor: pointer;
           background: var(--btn); color: var(--btn-fg); font-size: 1rem; font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  section + section { margin-top: 32px; padding-top: 32px; border-top: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <span class="dot" aria-hidden="true"></span>
  <section data-lang="en" lang="en">
    <h1>You're offline</h1>
    <p>No connection right now. Your progress is safe. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </section>
  <section data-lang="zh-TW" lang="zh-TW">
    <h1>目前離線</h1>
    <p>現在沒有網路連線，你的學習進度都還在。恢復連線後再試一次。</p>
    <button type="button" onclick="location.reload()">重試</button>
  </section>
</main>
<script>
  // 依瀏覽器語言只顯示一種；腳本沒執行時兩種都顯示（漸進式增強）。
  (function () {
    var lang = (navigator.language || 'en').toLowerCase();
    var chosen = lang.indexOf('zh') === 0 ? 'zh-TW' : 'en';
    document.documentElement.lang = chosen;
    var blocks = document.querySelectorAll('[data-lang]');
    for (var i = 0; i < blocks.length; i++) blocks[i].hidden = blocks[i].getAttribute('data-lang') !== chosen;
  })();
</script>
</body>
</html>
